<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | BioCompost</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="login-fondo">
    <div class="card login-tarjeta">
      <div class="card-body p-4 p-sm-5">
        <div class="text-center mb-4">
          <img src="assets/logo.svg" alt="Logo BioCompost" width="64" height="64">
          <h1 class="h4 fw-bold mt-3 mb-1">BioCompost</h1>
          <p class="texto-suave small mb-0">Trazabilidad de residuos orgánicos y compostaje agrícola</p>
        </div>

        <div id="aviso" class="alert d-none small" role="alert"></div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="correo" name="correo" required maxlength="120"
                     placeholder="usuario@biocompost.com" autocomplete="username" autofocus>
              <div class="invalid-feedback">Ingrese un correo electrónico válido.</div>
            </div>
          </div>
          <div class="mb-4">
            <label for="contrasena" class="form-label">Contraseña</label>
            <div class="input-group has-validation">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control" id="contrasena" name="contrasena" required maxlength="50"
                     autocomplete="current-password">
              <button class="btn btn-outline-secondary" type="button" id="verContrasena" aria-label="Mostrar contraseña">
                <i class="bi bi-eye"></i>
              </button>
              <div class="invalid-feedback">Ingrese su contraseña.</div>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100 py-2" id="btnIngresar">
            <i class="bi bi-box-arrow-in-right me-1"></i>Ingresar
          </button>
        </form>
      </div>
      <div class="card-footer bg-transparent text-center small texto-suave py-3">
        Proyecto Integrador · Desarrollo Web · UCC Cali
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

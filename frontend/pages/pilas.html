<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pilas de compostaje | BioCompost</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="layout">
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar"></aside>
    <div class="contenido">
      <header class="topbar d-flex align-items-center gap-2" id="topbar"></header>

      <main class="p-3 p-lg-4">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
          <p class="texto-suave mb-0">Seguimiento del proceso de maduración de cada pila.</p>
          <button class="btn btn-primary" id="btnNuevo" data-solo-admin><i class="bi bi-plus-lg me-1"></i>Nueva pila</button>
        </div>

        <div class="card mb-3 filtros">
          <div class="card-body">
            <label class="form-label">Filtrar por fase de maduración</label>
            <div class="d-flex flex-wrap gap-2 fases mb-3" id="botonesFase"></div>
            <div class="row g-2">
              <div class="col-md-5">
                <input type="search" class="form-control" id="fTexto" placeholder="Buscar por código o ubicación" aria-label="Buscar pila">
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header d-flex justify-content-between">
            <span>Pilas</span><span class="texto-suave small fw-normal" id="resumen"></span>
          </div>
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead>
                <tr><th>Pila</th><th>Fase</th><th>Inicio</th><th class="numero">Días</th>
                    <th>Residuo recibido</th><th>Última medición</th><th class="numero">Abono (kg)</th><th></th></tr>
              </thead>
              <tbody id="tabla"></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div class="modal fade" id="modalPila" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
      <form class="modal-content" id="formPila" novalidate>
        <div class="modal-header">
          <h5 class="modal-title" id="tituloModal">Nueva pila</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div class="alert alert-danger d-none" data-alerta></div>
          <div class="row g-3">
            <div class="col-6">
              <label class="form-label" for="codigo">Código *</label>
              <input class="form-control text-uppercase" id="codigo" name="codigo" required minlength="3" maxlength="20" pattern="[A-Za-z0-9\-]+" placeholder="P-2026-07">
              <div class="invalid-feedback">Letras, números y guiones (3 a 20).</div>
            </div>
            <div class="col-6">
              <label class="form-label" for="ubicacion">Ubicación</label>
              <input class="form-control" id="ubicacion" name="ubicacion" maxlength="100" placeholder="Patio A - Era 3">
            </div>
            <div class="col-6">
              <label class="form-label" for="fecha_inicio">Fecha de inicio *</label>
              <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio" required>
              <div class="invalid-feedback">Ingrese una fecha válida (no futura).</div>
            </div>
            <div class="col-6">
              <label class="form-label" for="capacidad_kg">Capacidad (kg)</label>
              <input type="number" class="form-control" id="capacidad_kg" name="capacidad_kg" min="1" max="100000" step="1">
              <div class="invalid-feedback">Entre 1 y 100.000 kg.</div>
            </div>
            <div class="col-6">
              <label class="form-label" for="fase">Fase *</label>
              <select class="form-select" id="fase" name="fase" required></select>
            </div>
            <div class="col-6" id="grupoFechaFin">
              <label class="form-label" for="fecha_fin">Fecha de finalización *</label>
              <input type="date" class="form-control" id="fecha_fin" name="fecha_fin">
              <div class="invalid-feedback">Obligatoria al finalizar; no puede ser anterior al inicio ni futura.</div>
            </div>
            <div class="col-12">
              <label class="form-label" for="observaciones">Observaciones</label>
              <textarea class="form-control" id="observaciones" name="observaciones" rows="2" maxlength="400"></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btnGuardar"><i class="bi bi-check-lg me-1"></i>Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/pilas.js"></script>
</body>
</html>

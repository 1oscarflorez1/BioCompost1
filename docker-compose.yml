# Base de datos Oracle Database 23ai Free para desarrollo local.
# Las credenciales se leen del archivo .env (copiar .env.example -> .env).
# Uso:  docker compose up -d      (la primera vez tarda unos minutos)
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: biocompost-oracle
    ports:
      - "1521:1521"
    environment:
      TZ: America/Bogota  # SYSDATE con la hora de Colombia
      ORACLE_PASSWORD: ${ORACLE_ADMIN_PASSWORD:?Defina ORACLE_ADMIN_PASSWORD en el archivo .env}
      APP_USER: ${DB_USER:?Defina DB_USER en el archivo .env}
      APP_USER_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en el archivo .env}
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  oracle-data:
